<!doctype html>
<script type="module">
let nextId = 0;
// This worker owns only the trusted compiler bundle and its immutable parsed
// toolchain resources. YoWASP creates a fresh compiler environment and Wasm
// instance for each runClang call; compiled user programs are transferred out
// and must never be instantiated in this frame or compiler worker.
let compilerWorker = null;
const pendingCompiles = new Map();
const frameParameters = new URLSearchParams(location.search);
const frameToken = frameParameters.get('tracecodeFrameToken') || '';
const allowedParentOrigin = (() => {
  const value = frameParameters.get('tracecodeParentOrigin');
  if (!value) return location.origin;
  try {
    const url = new URL(value);
    return (url.protocol === 'http:' || url.protocol === 'https:') && url.origin === value
      ? url.origin
      : '';
  } catch {
    return '';
  }
})();
const configuredCompilerWorkerUrl = (() => {
  const value = frameParameters.get('tracecodeCompilerWorkerUrl');
  if (!value) return new URL('cpp-compiler-worker.js', location.href).href;
  try {
    const url = new URL(value, location.href);
    return url.origin === location.origin ? url.href : '';
  } catch {
    return '';
  }
})();

function encodeError(error) {
  return error instanceof Error ? error.message : String(error);
}

function rejectPendingCompiles(error) {
  for (const [, request] of pendingCompiles) {
    clearTimeout(request.timeoutId);
    request.reject(error);
  }
  pendingCompiles.clear();
}

function resetCompilerWorker(error = null) {
  if (compilerWorker) {
    compilerWorker.onmessage = null;
    compilerWorker.onerror = null;
    compilerWorker.onmessageerror = null;
    compilerWorker.terminate();
  }
  compilerWorker = null;
  if (error) rejectPendingCompiles(error);
}

function getCompilerWorker() {
  if (compilerWorker) return compilerWorker;
  if (!configuredCompilerWorkerUrl) {
    throw new Error('C++ compiler worker URL must share the compiler frame origin');
  }
  compilerWorker = new Worker(configuredCompilerWorkerUrl, { type: 'module' });
  compilerWorker.onmessage = (event) => {
    const data = event.data || {};
    if (data.type === 'worker-ready') return;
    const request = pendingCompiles.get(data.id);
    if (!request) return;
    if (data.protocolToken !== request.protocolToken) return;
    pendingCompiles.delete(data.id);
    clearTimeout(request.timeoutId);
    if (data.type !== 'compile-result') {
      request.reject(new Error(`Unexpected C++ compiler worker response: ${data.type}`));
      return;
    }
    request.resolve(data.payload);
  };
  compilerWorker.onerror = (event) => {
    resetCompilerWorker(new Error(event.message || 'C++ compiler worker error'));
  };
  compilerWorker.onmessageerror = () => {
    resetCompilerWorker(new Error('C++ compiler worker response failed to deserialize'));
  };
  return compilerWorker;
}

function compile(payload) {
  return new Promise((resolve, reject) => {
    const worker = getCompilerWorker();
    const id = String(++nextId);
    const protocolToken = `frame-compiler-${id}-${Date.now()}-${Math.random()}`;
    const timeoutId = setTimeout(() => {
      resetCompilerWorker(new Error('C++ compiler worker request timed out'));
    }, 120000);
    pendingCompiles.set(id, { protocolToken, resolve, reject, timeoutId });
    worker.postMessage({ id, type: 'compile', payload, protocolToken });
  });
}

addEventListener('pagehide', () => {
  resetCompilerWorker(new Error('C++ compiler frame was closed'));
});

addEventListener('message', async (event) => {
  if (event.data?.type !== 'compile') return;
  if (event.source !== parent) return;
  if (event.origin !== allowedParentOrigin) return;
  if (typeof frameToken !== 'string' || frameToken.length === 0) return;
  if (event.data.frameToken !== frameToken) return;
  if (typeof event.data.protocolToken !== 'string' || event.data.protocolToken.length === 0) return;

  try {
    const payload = await compile(event.data.payload);
    const transfer = payload?.programBuffer instanceof ArrayBuffer ? [payload.programBuffer] : [];
    event.source?.postMessage({ id: event.data.id, type: 'compile-result', frameToken, protocolToken: event.data.protocolToken, payload }, event.origin, transfer);
  } catch (error) {
    event.source?.postMessage(
      {
        id: event.data.id,
        type: 'compile-result',
        frameToken,
        protocolToken: event.data.protocolToken,
        payload: { success: false, error: encodeError(error) },
      },
      event.origin
    );
  }
});

if (frameToken && allowedParentOrigin) {
  parent.postMessage({ type: 'frame-ready', frameToken }, allowedParentOrigin);
}
</script>
