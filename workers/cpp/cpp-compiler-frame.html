<!doctype html>
<script type="module">
let nextId = 0;
let compilerWorker = null;
const pendingCompiles = new Map();

function encodeError(error) {
  return error instanceof Error ? error.message : String(error);
}

function rejectPendingCompiles(error) {
  for (const [, request] of pendingCompiles) {
    clearTimeout(request.timeoutId);
    request.reject(error);
  }
  pendingCompiles.clear();
}

function resetCompilerWorker(error = null) {
  if (compilerWorker) {
    compilerWorker.onmessage = null;
    compilerWorker.onerror = null;
    compilerWorker.onmessageerror = null;
    compilerWorker.terminate();
  }
  compilerWorker = null;
  if (error) rejectPendingCompiles(error);
}

function getCompilerWorker() {
  if (compilerWorker) return compilerWorker;
  compilerWorker = new Worker('cpp-compiler-worker.js', { type: 'module' });
  compilerWorker.onmessage = (event) => {
    const data = event.data || {};
    if (data.type === 'worker-ready') return;
    const request = pendingCompiles.get(data.id);
    if (!request) return;
    if (data.protocolToken !== request.protocolToken) return;
    pendingCompiles.delete(data.id);
    clearTimeout(request.timeoutId);
    if (data.type !== 'compile-result') {
      request.reject(new Error(`Unexpected C++ compiler worker response: ${data.type}`));
      return;
    }
    request.resolve(data.payload);
  };
  compilerWorker.onerror = (event) => {
    resetCompilerWorker(new Error(event.message || 'C++ compiler worker error'));
  };
  compilerWorker.onmessageerror = () => {
    resetCompilerWorker(new Error('C++ compiler worker response failed to deserialize'));
  };
  return compilerWorker;
}

function compile(payload) {
  return new Promise((resolve, reject) => {
    const worker = getCompilerWorker();
    const id = String(++nextId);
    const protocolToken = `frame-compiler-${id}-${Date.now()}-${Math.random()}`;
    const timeoutId = setTimeout(() => {
      pendingCompiles.delete(id);
      reject(new Error('C++ compiler worker request timed out'));
    }, 120000);
    pendingCompiles.set(id, { protocolToken, resolve, reject, timeoutId });
    worker.postMessage({ id, type: 'compile', payload, protocolToken });
  });
}

addEventListener('message', async (event) => {
  if (event.data?.type !== 'compile') return;
  if (typeof event.data.protocolToken !== 'string' || event.data.protocolToken.length === 0) return;

  try {
    const payload = await compile(event.data.payload);
    const transfer = payload?.programBuffer instanceof ArrayBuffer ? [payload.programBuffer] : [];
    event.source?.postMessage({ id: event.data.id, type: 'compile-result', protocolToken: event.data.protocolToken, payload }, event.origin, transfer);
  } catch (error) {
    event.source?.postMessage(
      {
        id: event.data.id,
        type: 'compile-result',
        protocolToken: event.data.protocolToken,
        payload: { success: false, error: encodeError(error) },
      },
      event.origin
    );
  }
});

parent.postMessage({ type: 'frame-ready' }, '*');
</script>
