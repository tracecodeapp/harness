<!doctype html>
<script type="module">
let nextId = 0;
const pendingCompiles = new Map();
const frameToken = new URLSearchParams(location.search).get('tracecodeFrameToken') || '';
const allowedParentOrigin = location.origin;

function encodeError(error) {
  return error instanceof Error ? error.message : String(error);
}

function rejectPendingCompiles(error) {
  for (const [, request] of pendingCompiles) {
    clearTimeout(request.timeoutId);
    request.worker.onmessage = null;
    request.worker.onerror = null;
    request.worker.onmessageerror = null;
    request.worker.terminate();
    request.reject(error);
  }
  pendingCompiles.clear();
}

function finishCompile(id) {
  const request = pendingCompiles.get(id);
  if (!request) return null;
  pendingCompiles.delete(id);
  clearTimeout(request.timeoutId);
  request.worker.onmessage = null;
  request.worker.onerror = null;
  request.worker.onmessageerror = null;
  request.worker.terminate();
  return request;
}

function createCompilerWorker(id) {
  const worker = new Worker('cpp-compiler-worker.js', { type: 'module' });
  worker.onmessage = (event) => {
    const data = event.data || {};
    if (data.type === 'worker-ready') return;
    const request = pendingCompiles.get(data.id);
    if (!request) return;
    if (data.protocolToken !== request.protocolToken) return;
    finishCompile(data.id);
    if (data.type !== 'compile-result') {
      request.reject(new Error(`Unexpected C++ compiler worker response: ${data.type}`));
      return;
    }
    request.resolve(data.payload);
  };
  worker.onerror = (event) => {
    const request = finishCompile(id);
    request?.reject(new Error(event.message || 'C++ compiler worker error'));
  };
  worker.onmessageerror = () => {
    const request = finishCompile(id);
    request?.reject(new Error('C++ compiler worker response failed to deserialize'));
  };
  return worker;
}

function compile(payload) {
  return new Promise((resolve, reject) => {
    const id = String(++nextId);
    const protocolToken = `frame-compiler-${id}-${Date.now()}-${Math.random()}`;
    let worker;
    try {
      worker = createCompilerWorker(id);
    } catch (error) {
      reject(error instanceof Error ? error : new Error(String(error)));
      return;
    }
    const timeoutId = setTimeout(() => {
      const request = finishCompile(id);
      request?.reject(new Error('C++ compiler worker request timed out'));
    }, 120000);
    pendingCompiles.set(id, { protocolToken, resolve, reject, timeoutId, worker });
    worker.postMessage({ id, type: 'compile', payload, protocolToken });
  });
}

addEventListener('pagehide', () => {
  rejectPendingCompiles(new Error('C++ compiler frame was closed'));
});

addEventListener('message', async (event) => {
  if (event.data?.type !== 'compile') return;
  if (event.origin !== allowedParentOrigin) return;
  if (typeof frameToken !== 'string' || frameToken.length === 0) return;
  if (event.data.frameToken !== frameToken) return;
  if (typeof event.data.protocolToken !== 'string' || event.data.protocolToken.length === 0) return;

  try {
    const payload = await compile(event.data.payload);
    const transfer = payload?.programBuffer instanceof ArrayBuffer ? [payload.programBuffer] : [];
    event.source?.postMessage({ id: event.data.id, type: 'compile-result', frameToken, protocolToken: event.data.protocolToken, payload }, event.origin, transfer);
  } catch (error) {
    event.source?.postMessage(
      {
        id: event.data.id,
        type: 'compile-result',
        frameToken,
        protocolToken: event.data.protocolToken,
        payload: { success: false, error: encodeError(error) },
      },
      event.origin
    );
  }
});

if (frameToken) {
  parent.postMessage({ type: 'frame-ready', frameToken }, allowedParentOrigin);
}
</script>
