name: Browser compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: browser-compatibility
  cancel-in-progress: true

jobs:
  browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Install browser test runtimes
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test project providers across engines
        run: pnpm test:project-browser-matrix
      - name: Test live cross-provider TKFS across engines
        run: pnpm test:project-live-fs-browser-matrix
      - name: Test Project persistence across engines
        run: pnpm test:kernel-storage-browser-matrix
      - name: Test Classic providers across engines
        if: ${{ !cancelled() }}
        run: pnpm test:classic-browser-matrix
