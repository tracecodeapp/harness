name: Example preview lifecycle

on:
  pull_request:
    paths:
      - tests/example-app-smoke.ts
      - tests/example-preview-process.ts
      - tests/test-example-preview-process.ts
      - tests/test-sql-browser-example.ts
      - tests/test-example-app.ts
      - tests/test-java-example-app.ts
      - tests/test-project-terminal-example.ts
      - .github/workflows/example-preview-lifecycle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-preview-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.2.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove ANSI parsing and bounded process-tree cleanup
        run: node --import tsx --test tests/test-example-preview-process.ts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run SQL with the same forced colors as the stalled full suite
        run: FORCE_COLOR=1 node --import tsx tests/test-sql-browser-example.ts
