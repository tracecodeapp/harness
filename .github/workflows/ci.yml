name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    uses: ./.github/workflows/release-stack.yml
    with:
      harness-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      tracecc-ref: codex/harness-owned-runtime-assets
      tracejvm-ref: codex/harness-owned-runtime-assets
