name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Release PRs must validate the engine candidates before those packages
      # exist on npm. Each engine owns and verifies its tracked runtime tree;
      # Harness consumes the resulting tarballs exactly as a registry install
      # will after the three releases are approved.
      - uses: actions/checkout@v4
        with:
          repository: tracecodeapp/tracecc
          ref: eeeb31b665bef5ca6b78380177d18ca051e620a5
          path: .release-candidates/tracecc
      - uses: actions/checkout@v4
        with:
          repository: tracecodeapp/tracejvm
          ref: e1212e70e29889dca506911cb9bb94b21608fb75
          path: .release-candidates/tracejvm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Pack engine release candidates
        run: |
          mkdir -p "${RUNNER_TEMP}/tracecode-release-candidates/tracecc" \
            "${RUNNER_TEMP}/tracecode-release-candidates/tracejvm"
          pnpm --dir .release-candidates/tracecc install --frozen-lockfile
          (
            cd .release-candidates/tracecc
            npm pack --pack-destination "${RUNNER_TEMP}/tracecode-release-candidates/tracecc"
          )
          pnpm --dir .release-candidates/tracejvm install --frozen-lockfile
          (
            cd .release-candidates/tracejvm
            npm pack --pack-destination "${RUNNER_TEMP}/tracecode-release-candidates/tracejvm"
          )
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs = require('node:fs');
          const path = require('node:path');
          const temp = process.env.RUNNER_TEMP;
          for (const [name, directory] of [
            ['TRACECODE_TRACECC_CANDIDATE_PACKAGE', 'tracecc'],
            ['TRACECODE_TRACEJVM_CANDIDATE_PACKAGE', 'tracejvm'],
          ]) {
            const root = path.join(temp, 'tracecode-release-candidates', directory);
            const packed = fs.readdirSync(root).filter((file) => file.endsWith('.tgz'));
            if (packed.length !== 1) throw new Error(`expected one ${name} tarball, found ${packed.length}`);
            console.log(`${name}=file:${path.resolve(root, packed[0])}`);
          }
          NODE
      - name: Install the three-repository release stack
        run: pnpm install --lockfile=false
      - name: Check generated runtime metadata
        run: pnpm test:runtime-info-sync && pnpm test:kernel-policy-sync && pnpm test:typescript-project-libs-sync
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test package surfaces and smoke
        run: pnpm test:packaged-surface && pnpm test:smoke && pnpm test:asset-sync
