name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Release PRs must validate the engine candidates before those packages
      # exist on npm. Each engine owns and verifies its tracked runtime tree;
      # Harness consumes the resulting tarballs exactly as a registry install
      # will after the three releases are approved.
      - uses: actions/checkout@v4
        with:
          repository: tracecodeapp/tracecc
          ref: codex/harness-owned-runtime-assets
          path: .release-candidates/tracecc
      - uses: actions/checkout@v4
        with:
          repository: tracecodeapp/tracejvm
          ref: codex/harness-owned-runtime-assets
          path: .release-candidates/tracejvm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Pack engine release candidates
        run: |
          mkdir -p "${RUNNER_TEMP}/tracecode-release-candidates"
          pnpm --dir .release-candidates/tracecc install --frozen-lockfile
          npm pack --prefix .release-candidates/tracecc \
            --pack-destination "${RUNNER_TEMP}/tracecode-release-candidates"
          pnpm --dir .release-candidates/tracejvm install --frozen-lockfile
          npm pack --prefix .release-candidates/tracejvm \
            --pack-destination "${RUNNER_TEMP}/tracecode-release-candidates"
      - name: Install the three-repository release stack
        env:
          TRACECODE_TRACECC_CANDIDATE_PACKAGE: file:${{ runner.temp }}/tracecode-release-candidates/tracecode-tracecc-0.1.0.tgz
          TRACECODE_TRACEJVM_CANDIDATE_PACKAGE: file:${{ runner.temp }}/tracecode-release-candidates/tracecode-tracejvm-0.4.1.tgz
        run: pnpm install --lockfile=false
      - name: Check generated runtime metadata
        run: pnpm test:runtime-info-sync && pnpm test:kernel-policy-sync && pnpm test:typescript-project-libs-sync
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test package surfaces and smoke
        run: pnpm test:packaged-surface && pnpm test:smoke && pnpm test:asset-sync
