name: Browser project performance

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Browser engine to measure
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      iterations:
        description: Measurement iterations
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: read

concurrency:
  group: browser-performance-${{ inputs.engine }}
  cancel-in-progress: true

jobs:
  project-provider-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Install ${{ inputs.engine }}
        run: pnpm exec playwright install --with-deps ${{ inputs.engine }}
      - name: Measure ${{ inputs.engine }} project providers
        env:
          TRACECODE_PROJECT_MATRIX_ENGINES: ${{ inputs.engine }}
          TRACECODE_PROJECT_MATRIX_ITERATIONS: ${{ inputs.iterations }}
          TRACECODE_PROJECT_MATRIX_REPORT_DIR: reports
          TRACECODE_PROJECT_MATRIX_PERFORMANCE_GATE: 1
        run: pnpm test:project-browser-matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-project-runtime-${{ inputs.engine }}
          path: reports/browser-project-runtime-${{ inputs.engine }}-*.json
          if-no-files-found: error
