name: Browser project performance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

jobs:
  project-provider-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Install ${{ matrix.engine }}
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - name: Measure ${{ matrix.engine }} project providers
        env:
          TRACECODE_PROJECT_MATRIX_ENGINES: ${{ matrix.engine }}
          TRACECODE_PROJECT_MATRIX_ITERATIONS: 5
          TRACECODE_PROJECT_MATRIX_REPORT_DIR: reports
          TRACECODE_PROJECT_MATRIX_PERFORMANCE_GATE: 1
        run: pnpm test:project-browser-matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-project-runtime-${{ matrix.engine }}
          path: reports/browser-project-runtime-${{ matrix.engine }}-*.json
          if-no-files-found: error
