name: Stage 1 runtime qualification

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-pack:
    uses: ./.github/workflows/stage1-clean-pack.yml
    with:
      candidate_sha: ${{ github.sha }}

  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TRACECODE_PARITY_SUITE: syntax
      TRACECODE_PARITY_REPORT: ${{ runner.temp }}/syntax-parity.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec tsx --tsconfig tsconfig.base.json tests/test-trace-parity-corpus.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syntax-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TRACECODE_PARITY_REPORT }}

  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/test-stage1-suite-floor.mjs
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/release-diff -p test_qualify.py
      - run: pnpm exec tsx --tsconfig tsconfig.base.json tests/test-python-script-file.ts
      - run: bash scripts/stage1/prove-recorder.sh

  csharp-post-pause:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm materialize:csharp-role-assets
      - run: bash scripts/stage1/prove-csharp-pause.sh "$RUNNER_TEMP/csharp-pause"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csharp-post-pause-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/csharp-pause/

  # Use checked-in fixtures in public CI. Release uses the complete W and
  # trace-parity catalogs on the build host with /root/ci/parity-app-data.
  host-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TRACECODE_HOST_HISTORY_FIXTURE_ONLY: '1'
      TRACECODE_HOST_HISTORY_REPORT: ${{ runner.temp }}/host-history.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify fixture histories
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            export TRACECODE_HOST_HISTORY_PROFILE=desktop
            languages=$(git diff --name-only "$PR_BASE" HEAD | node scripts/stage1/runtime-languages.mjs)
            bash scripts/run-untraced-host-history.sh "$languages"
          else
            bash scripts/run-untraced-host-history.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-host-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TRACECODE_HOST_HISTORY_REPORT }}
